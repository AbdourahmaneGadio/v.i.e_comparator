name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest

    outputs:
      application_or_tests: ${{ steps.changes.outputs.application_or_tests }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect application or test changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            application_or_tests:
              - 'src/**'
              - 'public/**'
              - 'e2e/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.ts'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'Dockerfile'
              - 'nginx.conf'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pre-commit checks
        run: npm run precommit

      - name: Build application
        if: steps.changes.outputs.application_or_tests == 'true'
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

  container:
    name: Build and publish container
    needs: quality
    runs-on: ubuntu-latest
    if: needs.quality.outputs.application_or_tests == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
