name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest

    outputs:
      application_or_tests: ${{ steps.changes.outputs.application_or_tests }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect application or test changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            application_or_tests:
              - 'src/**'
              - 'public/**'
              - 'e2e/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.ts'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'Dockerfile'
              - 'nginx.conf'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit and integration tests
        run: npm test -- --run

      - name: Build application
        if: steps.changes.outputs.application_or_tests == 'true'
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

  container:
    name: Build and publish container
    needs: quality
    runs-on: ubuntu-latest
    if: needs.quality.outputs.application_or_tests == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  pages:
    name: Deploy to GitHub Pages
    needs: quality
    runs-on: ubuntu-latest
    if: needs.quality.outputs.application_or_tests == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Create GitHub release
    needs: quality
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Determine release name
        id: release
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create release from tag
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release.outputs.name }}
          generate_release_notes: true
